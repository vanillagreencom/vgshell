# The full validation of main once a night, report only. No push, pull
# request or merge queue starts it and no merge reads its result. Each area is
# one job that runs scripts/validate --full --skip-unprepared AREA, which leaves
# out the rows that need prepared state a runner never holds. unit runs in
# scripts/main-run.sh's full main batch, so this workflow does not repeat it.
# qml does not
# run here: Hyprland allocates buffers only through GBM on a DRM device,
# which a hosted runner lacks, so scripts/main-run.sh qml runs it on a
# machine that has one.
name: nightly

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      force-build:
        description: Rebuild package and nix even when their inputs have a recent pass
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: ${{ matrix.area }}
    # Runs only when the repository variable NIGHTLY is "on", which is set
    # while the repository is public. An unset variable reads as an empty
    # string (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts,
    # `vars` context), so a private repository skips the job and bills nothing.
    if: vars.NIGHTLY == 'on'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: offline
            image: docker.io/library/archlinux:latest
          # Rootless podman starts these areas' own containers; it does not
          # run inside a container job, so they run on the runner itself.
          - area: package
            image: ""
          - area: nix
            image: ""
    # An empty image runs the job on the runner. --privileged lets the Jarvis
    # rows' private environment mount its own /proc in a user namespace;
    # --init reaps orphans, which the job container's own first process
    # (tail -f /dev/null) leaves as zombies that the process-lifetime rows
    # read as still running; the host's /lib/modules gives the updates
    # pipeline row a kernel release.
    container:
      image: ${{ matrix.image }}
      options: --privileged --init -v /lib/modules:/lib/modules:ro
    steps:
      - name: Install the Arch toolchain
        if: matrix.image != ''
        run: |
          # The tools the rows run; a row whose tool is missing exits 77.
          # ttf-dejavu gives Qt a default family, without which the QML unit
          # tests measure text drawn in no font. ttf-liberation supplies
          # the Liberation Sans family the ImageText layout test names.
          # xorg-server-xvfb and xorg-xauth give the MultiEffect unit test
          # the X display that scripts/qml-unit.sh draws it on.
          pacman -Syu --noconfirm --needed \
            git base-devel nodejs python python-dbus python-gobject python-numpy jq rclone \
            qt6-declarative quickshell util-linux bubblewrap lua gnupg sequoia-sqv \
            libsecret xdg-dbus-proxy sudo tmux ghostty neovim fd fzf gum file glib2 xdg-utils imagemagick ffmpeg \
            qt6-shadertools pipewire pipewire-audio ttf-dejavu ttf-liberation wayland-protocols \
            xorg-server-xvfb xorg-xauth
          useradd --create-home ci
          # Ubuntu restricts user namespaces to processes an AppArmor profile
          # allows, and the container's processes run unconfined.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Identify container build inputs
        if: matrix.area == 'package' || matrix.area == 'nix'
        id: build-inputs
        env:
          AREA: ${{ matrix.area }}
        run: |
          hash="$(scripts/validate "$AREA" --input-hash)"
          prefix="$RUNNER_OS-vgs-nightly-$AREA-v1-"
          {
            printf 'hash=%s\nprefix=%s\n' "$hash" "$prefix"
            printf 'key=%s%s-%s-%s-%s\n' "$prefix" "$hash" "$(date +%s)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >>"$GITHUB_OUTPUT"

      - name: Look up the latest passing container build
        if: matrix.area == 'package' || matrix.area == 'nix'
        id: build-pass
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/nightly-build-pass
          key: ${{ steps.build-inputs.outputs.key }}
          # A prefix match selects the newest-created pass, including a
          # different hash. A return from A through B to A must rebuild.
          # https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#matching-a-cache-key
          restore-keys: ${{ steps.build-inputs.outputs.prefix }}
          lookup-only: true

      - name: Decide whether the container build is due
        if: matrix.area == 'package' || matrix.area == 'nix'
        id: build-decision
        env:
          AREA: ${{ matrix.area }}
          INPUT_HASH: ${{ steps.build-inputs.outputs.hash }}
          CACHE_PREFIX: ${{ steps.build-inputs.outputs.prefix }}
          PASS_KEY: ${{ steps.build-pass.outputs.cache-matched-key }}
          FORCE_BUILD: ${{ inputs.force-build }}
        run: |
          skip=false
          reason='no recorded passing build'
          now="$(date +%s)"
          if [[ $FORCE_BUILD == true ]]; then
            reason='manual force build'
          elif [[ $PASS_KEY == "$CACHE_PREFIX"* ]]; then
            IFS=- read -r passed_hash passed_at _ <<<"${PASS_KEY#"$CACHE_PREFIX"}"
            if [[ $passed_hash != "$INPUT_HASH" ]]; then
              reason='inputs changed since the latest passing build'
            elif [[ $passed_at =~ ^[0-9]{10}$ ]] && ((now >= passed_at && now - passed_at < 604800)); then
              skip=true
              reason='unchanged inputs; latest passing build is less than 7 days old'
            else
              reason='latest passing build is at least 7 days old or its age is unreadable'
            fi
          fi
          printf 'skip=%s\n' "$skip" >>"$GITHUB_OUTPUT"
          {
            printf '### %s build inputs\n\nInput hash: %s\n\n' "$AREA" "$INPUT_HASH"
            printf 'Latest passing key: %s\n\n' "${PASS_KEY:-none}"
            printf 'Skip: %s (%s).\n\n' "$skip" "$reason"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Restore pinned catalog inputs
        if: matrix.area == 'offline'
        id: catalog-inputs
        uses: actions/cache/restore@v6
        with:
          path: /home/ci/.cache/vgshell/validate/theme-listings
          key: ${{ runner.os }}-vgs-theme-listings-${{ hashFiles('themes/catalog/index.json') }}

      - name: Prepare pinned catalog inputs
        if: matrix.area == 'offline' && steps.catalog-inputs.outputs.cache-hit != 'true'
        run: |
          chown -R ci:ci -- "$GITHUB_WORKSPACE"
          install -d -o ci -g ci /home/ci/.cache/vgshell/validate/theme-listings
          chown -R ci:ci -- /home/ci/.cache/vgshell/validate/theme-listings
          runuser -u ci -- scripts/validate --prepare-catalog-inputs

      - name: Save pinned catalog inputs
        if: matrix.area == 'offline' && steps.catalog-inputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /home/ci/.cache/vgshell/validate/theme-listings
          key: ${{ steps.catalog-inputs.outputs.cache-primary-key }}

      - name: scripts/validate --full --skip-unprepared ${{ matrix.area }}
        if: steps.build-decision.outputs.skip != 'true'
        id: full-build
        env:
          AREA: ${{ matrix.area }}
          IMAGE: ${{ matrix.image }}
        run: |
          run_as=()
          if [[ -n $IMAGE ]]; then
            chown -R ci:ci -- "$GITHUB_WORKSPACE"
            run_as=(runuser -u ci --)
          fi
          log="$RUNNER_TEMP/validate-$AREA.log"
          started=$SECONDS
          set +e
          "${run_as[@]}" scripts/validate "$AREA" --full --skip-unprepared 2>&1 | tee -- "$log"
          status=${PIPESTATUS[0]}
          set -e
          case $status in
            0) verdict=passed ;;
            77) verdict='could not run (exit 77, not a pass)' ;;
            *) verdict=failed ;;
          esac
          {
            printf '### %s: %s\n\nexit=%s secs=%s\n\n```\n' "$AREA" "$verdict" "$status" "$((SECONDS - started))"
            grep -E '^validate: (secs=[0-9]+ exit=[1-9]|failed=|status=not-measured|refused:)' -- "$log" ||
              tail -n 20 -- "$log"
            grep -E '^validate: unselected ' -- "$log" || true
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Record the passing container build
        if: (matrix.area == 'package' || matrix.area == 'nix') && steps.full-build.outcome == 'success'
        env:
          INPUT_HASH: ${{ steps.build-inputs.outputs.hash }}
        run: printf '%s\n' "$INPUT_HASH" >"$RUNNER_TEMP/nightly-build-pass"

      - name: Save the passing container build
        if: (matrix.area == 'package' || matrix.area == 'nix') && steps.full-build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/nightly-build-pass
          key: ${{ steps.build-inputs.outputs.key }}
