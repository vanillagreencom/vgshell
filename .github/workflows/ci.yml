# The `CI` context the `main required checks` ruleset requires on every pull request and merge
# group. GitHub reports it only from a workflow of this repository: without one, no pull request
# here merges. The repository has no lane yet, so the one job reports green. Move its lanes in
# by .agents/skills/harness-ci/templates/ci.yml, keeping the job name `CI` and both events.
name: CI

"on":
  pull_request:
  merge_group:

permissions: {}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "no lane yet; .agents/skills/harness-ci/templates/ci.yml is the shape the repository's lanes move into"
