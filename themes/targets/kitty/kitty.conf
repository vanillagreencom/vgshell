# The vgs theme for kitty, included from kitty.conf by vgshell theme apply.
foreground #@{palette.foreground}
background #@{palette.background}
selection_foreground #@{palette.foreground}
selection_background #@{color.borderStrong}
cursor #@{palette.foreground}
cursor_text_color #@{palette.background}
url_color #@{palette.accent}
active_tab_foreground #@{bar.onActive}
active_tab_background #@{bar.active}
inactive_tab_foreground #@{color.textMuted}
inactive_tab_background #@{color.background}
tab_bar_background #@{color.background}
tab_bar_margin_color #@{color.background}
active_border_color #@{color.accent}
inactive_border_color #@{color.borderControl}
