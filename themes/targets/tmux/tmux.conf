# The vgs theme for tmux, sourced by vgshell theme apply as the last line of
# the user's tmux configuration, so its colours win over the user's colours.
# Every #{...} below is a tmux format, which the render leaves as it is.
set -g status-style "bg=#@{color.background},fg=#@{color.text}"
# Inline colours in a user's formats override the style options. These
# labels use the rendered styles, including activity and bell colours.
# A filled label for the current item, the session, the selected menu item
# and the current copy-mode match, takes the bar's active desk pair; the
# window tabs draw no fill, so their text alone marks the current one.
set -g status-left-style "bg=#@{bar.active},fg=#@{bar.onActive},bold"
set -g message-style "bg=#@{color.surfaceRaised},fg=#@{color.text}"
set -g message-command-style "bg=#@{color.surfaceRaised},fg=#@{palette.accent}"
set -g mode-style "bg=#@{color.accent},fg=#@{color.onAccent}"
set -g pane-border-style "fg=#@{color.border}"
set -g pane-active-border-style "#{?pane_in_mode,fg=#@{palette.warning},#{?synchronize-panes,fg=#@{palette.danger},fg=#@{palette.accent}}}"
set -g window-status-style "bg=#@{color.background},fg=#@{terminal.color8}"
set -g window-status-current-style "bg=#@{color.background},fg=#@{color.info},bold"
set -g window-status-activity-style "fg=#@{color.warning}"
set -g window-status-bell-style "fg=#@{color.danger},bold"
set -g clock-mode-colour "#@{palette.accent}"
set -g display-panes-colour "#@{color.textMuted}"
set -g display-panes-active-colour "#@{palette.accent}"
# Omarchy's RGB line; Claude Code drops to 256 colours under TMUX unless the variable is set.
set -ag terminal-overrides ",*:RGB"
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1
# Hermes' classic CLI reads prompt_toolkit's explicit colour-depth override.
set-environment -g PROMPT_TOOLKIT_COLOR_DEPTH DEPTH_24_BIT
# Options tmux 3.8 lists that older releases lack take -q, so an older
# tmux skips them.
set -gq menu-style "bg=#@{color.surfaceRaised},fg=#@{color.text}"
set -gq menu-selected-style "bg=#@{bar.active},fg=#@{bar.onActive}"
set -gq menu-border-style "bg=#@{color.surfaceRaised},fg=#@{color.borderStrong}"
set -gq popup-style "bg=#@{color.background},fg=#@{color.text}"
set -gq popup-border-style "bg=#@{color.background},fg=#@{color.borderStrong}"
set -gq display-panes-border-style "bg=#@{color.background},fg=#@{color.border}"
set -gq copy-mode-match-style "bg=#@{color.info},fg=#@{color.onInfo}"
set -gq copy-mode-current-match-style "bg=#@{bar.active},fg=#@{bar.onActive}"
set -gq copy-mode-mark-style "bg=#@{color.warning},fg=#@{color.onWarning}"
set -gq copy-mode-line-number-style "fg=#@{color.textMuted}"
set -gq copy-mode-current-line-number-style "fg=#@{color.accent}"
set -gq switch-mode-match-style "bg=#@{color.info},fg=#@{color.onInfo}"
set -gq pane-scrollbars-style "bg=#@{color.surfaceRaised},fg=#@{color.textMuted},width=1,pad=0"
set -gq tree-mode-border-style "bg=#@{color.background},fg=#@{color.border}"
set -gq tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#@{palette.accent},#@{color.border}}"
# Colour-bearing inline styles beat the options above. tmux's s modifier
# removes whole coloured spans without expanding text, formats or #()
# commands. Discover array indexes so an empty row stays empty. The doubled
# hash defers the substitution until set -F, after the shell selects OPTION.
run-shell 'for option in status-left status-right message-format window-status-format window-status-current-format window-status-separator pane-border-format window-pane-status-format window-pane-current-status-format fill-character $(tmux show -g status-format | cut -d " " -f 1); do tmux set -gqF "$option" "##{s~#[[]([^]]*[, ])?(fg|bg|us|fill)=[^]]*[]]~~:$option}"; done'
# -u restores tmux's default style, which inherits the rendered colours.
set -gqu status-right-style
set -gqu window-status-last-style
set -gqu pane-status-style
set -gqu pane-status-current-style
set -gqu session-status-style
set -gqu session-status-current-style
set -gqu copy-mode-selection-style
set -gqu copy-mode-position-style
set -gqu copy-mode-current-line-style
set -gqu tree-mode-selection-style
set -gqu window-style
set -gqu window-active-style
set -gqu pane-colours
set -gqu cursor-colour
set -gqu prompt-cursor-colour
set -gqu prompt-command-cursor-colour
