# The vgs theme for Ghostty, read through config-file from config.ghostty by vgshell theme apply.
# The reload hook sends SIGUSR2, which Ghostty 1.2.0 and later take as a reload; an older Ghostty is ended by it.
background = #@{palette.background}
foreground = #@{palette.foreground}
faint-opacity = 0.8
selection-background = #@{color.borderStrong}
selection-foreground = #@{palette.foreground}
cursor-color = #@{palette.foreground}
cursor-text = #@{palette.background}
palette = 0=#@{terminal.color0}
palette = 1=#@{terminal.color1}
palette = 2=#@{terminal.color2}
palette = 3=#@{terminal.color3}
palette = 4=#@{terminal.color4}
palette = 5=#@{terminal.color5}
palette = 6=#@{terminal.color6}
palette = 7=#@{terminal.color7}
palette = 8=#@{terminal.color8}
palette = 9=#@{terminal.color9}
palette = 10=#@{terminal.color10}
palette = 11=#@{terminal.color11}
palette = 12=#@{terminal.color12}
palette = 13=#@{terminal.color13}
palette = 14=#@{terminal.color14}
palette = 15=#@{terminal.color15}
# @{appearance.terminalFont|set=An empty value clears the families set before this file, so the next line replaces them.}
font-family = @{appearance.terminalFont|set=""}
font-family = "@{appearance.terminalFont}"
