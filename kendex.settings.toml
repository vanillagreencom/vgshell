# Public kendex settings seeded from installed skill defaults.
# Skill scripts read this [env] table; process env and .env.local override it.
# Keep secrets, tokens, and personal overrides in .env.local.

[env]
# The command that runs this project's tests, linting and type checks. An
# agent runs it from the project root, and refuses to finish the work while
# this is empty.
DEV_VALIDATE_CMD = ""

# The target for writes that need a configured team.
# Existing-issue writes use the issue team without this setting.
# Creating an issue, project, cycle or label can name one for that call.
# There is no default: while this is empty, writes that need a configured
# team are refused rather than guessing a team inside the key's workspace.
LINEAR_TEAM = ""
