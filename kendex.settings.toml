# Public kendex settings for VGS. Keep secrets in .env.local. A kendex
# skill script resolves a key from the environment, then .env.local, then
# .kendex/settings.toml, then this [env] table, then its own built-in default.
# `.env` is never read.

[env]
DECISIONS_DIR = "docs/decisions"
DECISIONS_BASE_REF = "origin/main"
# Issue branches use the vgs Linear identifier: vgs-<n>-<slug>.
GH_ISSUE_PATTERN = "vgs-[0-9]+"

# Extra test-path globs branch-size-check adds to its built-in test rule, which
# names none of them. The controls `scripts/validate` runs are validation code;
# counting their added lines as production growth spends a branch's stated
# allowance on its tests. Every control is a `scripts/test-*` file in one of
# three languages; the checks and runners beside them stay production.
ORCH_SIZE_TEST_PATHS = "scripts/test-*.js scripts/test-*.py scripts/test-*.sh"

# File-size thresholds come from the shipped path classes. No DOC_LIMITS_*
# key here: a repeated default goes stale when the class changes.

# The owner's order for this organization's repositories (Slack
# 1793558900.347579): Claude CLI first, GPT through the Copilot seat next,
# Codex CLI as the fallback. The second opinion does not default to Copilot.
SECOND_OPINION_MODELS = "claude pi-copilot-gpt codex"
# The organization's common roster block (owner Slack 1793840110.122229 and
# 1793840145.668199). Each room check passes --max-pct 100, which keeps the
# seat reserve. An entry whose account cannot be read skips, and the roster
# continues with the next entry.
SECOND_OPINION_CLAUDE_MODEL = "claude-opus-5.5"
SECOND_OPINION_CLAUDE_CMD = "claude -p --output-format json --no-session-persistence --model claude-opus-5-5 --effort high --restricted --permission-mode dontAsk --tools Bash,Read,Glob,Grep --allowedTools Bash(read-only:true),Read,Glob,Grep --setting-sources="
SECOND_OPINION_CLAUDE_ROOM_CMD = ".agents/skills/agent-runtime/scripts/agent-runtime accounts pick --env --harness claude --native-model claude-opus-5-5 --max-pct 100"
SECOND_OPINION_PI_COPILOT_GPT_MODEL = "github-copilot/gpt-6.1-sol"
SECOND_OPINION_PI_COPILOT_GPT_CMD = "pi -p --no-session --no-extensions --model github-copilot/gpt-6.1-sol --thinking high --tools read,grep,find,ls"
SECOND_OPINION_PI_COPILOT_GPT_INLINE_DIFF = "1"
SECOND_OPINION_PI_COPILOT_GPT_ROOM_CMD = ".agents/skills/agent-runtime/scripts/agent-runtime accounts pick --env --harness pi --native-model github-copilot/gpt-6.1-sol --max-pct 100"
SECOND_OPINION_CODEX_MODEL = "gpt-6.1-sol"
SECOND_OPINION_CODEX_CMD = "codex exec -m gpt-6.1-sol -s read-only -c model_reasoning_effort=xhigh --disable hooks --ephemeral"
SECOND_OPINION_CODEX_ROOM_CMD = ".agents/skills/agent-runtime/scripts/agent-runtime accounts pick --env --harness codex --native-model gpt-6.1-sol --binding-floor --max-pct 100"
WORKTREE_BASE_DIR = "~/dev/.worktrees/vgshell"
WORKTREE_DEFAULT_BRANCH = "main"
WORKTREE_MKDIRS = "tmp"
WORKTREE_SYMLINKS = ".env.local .cache"


# The team for Linear issue writes.
LINEAR_TEAM = "vgs"

# Issue identifier prefix used in examples (e.g. PROJ-123).
LINEAR_TEAM_PREFIX = "VGS"

# Orch reads this switch even without the review-gate package installed.
REVIEW_GATE_MODE = "off"

# The agent-routing labels the project-management taxonomy declares. A create
# carrying none of them is refused: such an issue is invisible to routing.
LINEAR_AGENT_LABELS = "agent:frontend, agent:runtime, agent:maintainer, agent:multi, agent:human, agent:researcher"

# Timed owner reports every two hours.
ORCH_REPORT_EVERY_MINUTES = "120"

# The owner's quiet hours are 9 pm to 8 am Pacific (owner Slack
# 1792183764, 2026-10-16; Jarvis decision, 2026-11-13). The 23-8 owner-message
# night rule is separate. Changing these hours needs the owner.
ORCH_REPORT_QUIET_HOURS = "21-8"

# Owner asks bound to an item post on it, assigned to the owner
# (KENDEX_USER_EMAIL), under this label.
ORCH_OWNER_ASK_LABEL = "owner-gated"

# ORCH_LANE_ALIASES (optional) maps config-directory names to lane names.
# Discovery owns the lane inventory; ORCH_LANE_DIRS covers other layouts.

# Used by: orch (`oversee`). Max concurrent lanes the overseer keeps in
# flight.
ORCH_OVERSEER_LANES = "9"

# The owner directs the fleet as CEO: decision points take the recommended
# option and merges proceed once every gate is green.
ORCH_USER_MODE = "ceo"

# Controller succession order at medium effort. Codex names its exact model,
# since its class runs the harness default.
AGENT_RUNTIME_CONTROLLER_PREFERENCE = "claude:standard:medium,copilot:claude-opus-5.5:medium,codex:gpt-6.1-sol:medium"
ORCH_HANDOFF_HEADROOM_PCT = "3"

# The accounts the judge picks among on this machine, as folders under HOME.
# With none named, every account pick refuses.
AGENT_RUNTIME_ACCOUNT_DIRS = ".claude:.1claude:.2claude:.3claude:.4claude:.5claude:.6claude:.7claude:.8claude:.9claude:.10claude:.codex:.3codex:.1copilot"
# Accounts the judge measures and never picks.
AGENT_RUNTIME_ACCOUNT_EXCLUDE = "sclaude,claude-work,1codex,2codex,copilot,scodex"
# The UTC day each account stops being picked.
AGENT_RUNTIME_ACCOUNT_RETIRE = "claude=2026-11-19,1claude=2026-11-26,2claude=2026-11-20,3claude=2026-11-27,4claude=2026-11-30,5claude=2026-12-01,6claude=2026-12-05,7claude=2026-12-19,8claude=2026-10-19,9claude=2026-10-20,10claude=2026-10-21"
AGENT_RUNTIME_ACCOUNT_MAX_PCT = "95"
AGENT_RUNTIME_CODEX_CREDIT_FLOOR = "0"

# Execute the audit's accepted creations and cancellations without a question.
PM_CREATE_AUTONOMY = "auto"

# Cross-model review selects an available roster entry distinct from this session.
# See the second-opinion skill for selection rules.
# Pi and Copilot callers must export SECOND_OPINION_CURRENT_MODEL with their
# actual current model for each invocation, including after switching models.
# Never put that session identity in a project settings file.


# Repo-local check the pre-commit shim runs LAST: a repo-root-relative
# executable following the family exit contract (0 clean, 1 violations,
# else "could not complete"); any nonzero blocks the commit, and so does a
# missing or non-executable value. Empty = no repo-local check; the chain
# runs the staged bot-instructions check itself.
COMMIT_GUARDS_PRE_COMMIT_LOCAL = ""

# md-refs judges every tracked markdown file, decision records and READMEs
# included, not only the agent-loaded set.
COMMIT_GUARDS_MD_REFS_PATHS = "*.md"

# md-refs reads source comments for `<path>.md § Heading` citations. The
# default list is extensions only, so this is that list plus the
# extensionless scripts, whose grammar their `#!` line names.
COMMIT_GUARDS_MD_REFS_SOURCE_PATHS = "*.rs *.go *.c *.h *.cc *.cpp *.hpp *.java *.kt *.kts *.swift *.wgsl *.js *.mjs *.cjs *.jsx *.ts *.tsx *.css *.scss *.less *.sh *.bash *.zsh *.py *.rb *.toml *.yml *.yaml *.sql *.lua *.html *.htm *.xml *.svg *.vue *.svelte Makefile */Makefile *.mk Dockerfile */Dockerfile bin/vgshell* shell/plugins/*/bin/* scripts/smoke/fixtures/updates-bin/* scripts/validate scripts/release scripts/vendor-lucide"

# Diff-scoped local checks, including the isolated smoke only when affected.
DEV_VALIDATE_CMD = "scripts/validate"
DEV_VALIDATE_RANGE_CMD = "scripts/validate"
# The expected run time the run-time warning reads: a time is a reading, never a stop.
DEV_VALIDATE_EXPECTED_SECS = "7200"

# The optional stages VGS runs. VGS arms no git hooks (AGENTS.md), and the
# owner's test rule runs no focused check before scripts/validate's own
# selection (D100), so git-hooks and focused-proof stay off. doc-limits
# runs inside scripts/validate, and VGS has no preflight setup.
ORCH_STAGES = "external-review local-review"

# A dev round checks changed views and its screenshot pair against this doc.
QA_UI_DESIGN_DOC = "docs/architecture/design-system.md"

# View sources whose changes need the lane's sandbox screenshot check.
QA_UI_PATHS = "shell/*.qml shell/**/*.qml"

# The kendex command-safety hook refuses a systemd-run command whose MemoryMax
# or MemoryHigh value is a number followed by K or M; a value in G, a bare
# byte count or a percentage passes.
COMMAND_SAFETY_DENY_PATTERN = "(^|[^[:alnum:]_-])systemd-run[[:space:]][^;|&]*Memory(Max|High)=[0-9]+[KkMm]([^[:alnum:]]|$)"

# The Slack Jarvis session hold: while the Jarvis session keeps this file
# younger than the age in seconds, the Slack relay holds its mailbox posts.
# A machine with no Jarvis session never has the file, so nothing is held there.
SLACK_JARVIS_SESSION_FILE = "~/.fleet/master-live"
SLACK_JARVIS_SESSION_MAX_AGE = "1800"
